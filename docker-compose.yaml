services:
  mongodb:
    image: mongo:latest
    container_name: vuturrajyo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongo-express:
    image: mongo-express:latest
    container_name: vuturrajyo-mongo-express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongodb:27017/"
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongodb_data:
